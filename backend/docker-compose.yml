version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uzestate_fastapi
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://uzestate:uzestate_password@db:5432/uzestate_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: uzestate_postgres
    restart: always
    environment:
      POSTGRES_USER: uzestate
      POSTGRES_PASSWORD: uzestate_password
      POSTGRES_DB: uzestate_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
